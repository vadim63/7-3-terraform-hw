---
- name: Install and start nginx on webservers
  hosts: webservers
  become: true
  vars:
    ansible_user: user
  
  roles: 
    - nginx

- name: Install PostgreSQL
  hosts: database
  become: true
  vars: 
    ansible_user: user
  
  tasks:
    - name: Download PostgreSQL
      ansible.builtin.apt:
        name: ["postgresql", "postgresql-contrib"]
        state: present
        update_cache: yes
    
    - name: Starting and enable database
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true
    
    - name: Collect services states
      ansible.builtin.service_facts:
        
    - name: Show PostgreSQL service state
      ansible.builtin.debug:
        msg: "{{ ansible_facts.services['postgresql.service'] }}"